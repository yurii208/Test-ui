<title>ChargerXpert</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: prototype bar on top, then one of five shells (LINE phone stage, public site, customer app, admin sidebar app, QR passport). Yellow is the signature, black carries structure. */
:root{
  --y:#FFC928; --y-wash:#FFF6D6; --y-ink:#6B4F00;
  --ink:#171717; --paper:#FFFFFF; --mist:#F4F4F2; --mute:#777777; --rule:#E3E3DD; --field:#D2D2CB;
  --ok:#269B62; --ok-wash:#E3F4EB; --ok-ink:#17653F;
  --warn:#F29D38; --warn-wash:#FDEFDC; --warn-ink:#84500A;
  --bad:#D94A4A; --bad-wash:#FBE5E5; --bad-ink:#9B2B2B;
  --fd:'Prompt','IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --fb:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sh:0 1px 2px rgba(23,23,23,.06),0 10px 24px -14px rgba(23,23,23,.2);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--fb)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:60}
h1,h2,h3,h4{font-family:var(--fd);margin:0;font-weight:600;line-height:1.3;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mu{color:var(--mute)} .mono{font-family:var(--fm);font-size:.92em} .tn{font-variant-numeric:tabular-nums}
.ic{flex:none;vertical-align:middle}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.g2,.g3,.g4{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g2>*,.g3>*,.g4>*{min-width:0}

/* prototype bar */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:#fff}
.pbar .wrap{display:flex;gap:8px 12px;align-items:center;padding-block:8px;flex-wrap:wrap}
.pbar .tag{font:600 11px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--y)}
.pnav{display:flex;gap:4px;overflow-x:auto;flex:1 1 100%;order:5;min-width:0}
.pnav button{background:transparent;border:0;color:#d4d4cc;padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.pnav button.on{background:var(--y);color:var(--ink);font-weight:600}
.pbar select{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.pbar .ghost{background:#2a2a2a;border:1px solid #444;color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
@media(min-width:900px){.pnav{flex:1 1 auto;order:0}}

/* buttons, pills, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;min-height:42px}
.btn.y{background:var(--y);border-color:var(--y);color:var(--ink)} .btn.y:hover{background:#ffd351}
.btn.k{background:var(--ink);color:#fff} .btn.k:hover{background:#333}
.btn.o:hover{background:var(--mist)} .btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.block{width:100%} .btn.ghostb{border-color:var(--rule);font-weight:500}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--mist);color:#4d4d4d;white-space:nowrap}
.pill.y{background:var(--y-wash);color:var(--y-ink)} .pill.ok{background:var(--ok-wash);color:var(--ok-ink)}
.pill.w,.pill.warn{background:var(--warn-wash);color:var(--warn-ink)} .pill.bad{background:var(--bad-wash);color:var(--bad-ink)}
.pill.k{background:var(--ink);color:#fff} .pill.n,.pill.neutral{background:var(--mist);color:#4d4d4d}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:#3a3a3a}
.in{width:100%;padding:10px 12px;border:1px solid var(--field);border-radius:10px;background:#fff;color:var(--ink);font:inherit;min-height:42px}
textarea.in{min-height:84px;resize:vertical}
.unit{position:relative}.unit .in{padding-right:56px}.unit i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mute);font-size:13px;pointer-events:none}
.card{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:20px;box-shadow:var(--sh);min-width:0}
.card.flat{box-shadow:none} .card.mist{background:var(--mist);box-shadow:none;border-color:transparent}
.card h3{font-size:17px;margin-bottom:12px}
.note{font-size:13px;color:var(--mute)}
.box{border-radius:12px;padding:12px 14px;font-size:13.5px;background:var(--y-wash);color:#4d3b00;display:flex;gap:10px;align-items:flex-start}
.box.bad{background:var(--bad-wash);color:var(--bad-ink)} .box.ok{background:var(--ok-wash);color:var(--ok-ink)} .box.mist{background:var(--mist);color:#444}
.kv{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--mute)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.scroll{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font:600 11.5px var(--fd);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl tr[data-go]{cursor:pointer}.tbl tr[data-go]:hover td{background:var(--y-wash)}
.stat{padding:16px 18px;border-radius:14px;background:#fff;border:1px solid var(--rule)}
.stat b{display:block;font:600 30px/1.1 var(--fd);font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--mist);overflow:hidden}.bar>i{display:block;height:100%;background:var(--y);border-radius:99px}
.hb{display:grid;grid-template-columns:130px 1fr 92px;gap:10px;align-items:center;font-size:13.5px;margin:10px 0}
.hb-t{height:18px;background:var(--mist);border-radius:6px;overflow:hidden}.hb-f{height:100%;background:var(--ink)}.hb-f.y{background:var(--y)}.hb-f.g{background:#9a9a92}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
.stp{display:flex;gap:6px;list-style:none;margin:0;padding:0;overflow-x:auto}
.stp li{flex:1 0 96px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute);border-top:3px solid var(--rule);padding-top:8px}
.stp li i{width:22px;height:22px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font:600 11px var(--fd);font-style:normal;color:#555}
.stp li.done{border-color:var(--ink);color:var(--ink)}.stp li.done i{background:var(--ink);color:#fff}
.stp li.cur{border-color:var(--y);color:var(--ink);font-weight:600}.stp li.cur i{background:var(--y);color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--rule);background:#fff;padding:8px 16px;border-radius:999px;font-weight:500}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:5px 14px;font-size:13px}.chips button.on{background:var(--y);border-color:var(--y);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--field);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg label{cursor:pointer}.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:8px 12px;font-size:13px;background:#fff;border-right:1px solid var(--field);min-width:56px;text-align:center}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--ink);color:#fff}
.seg input[value=obs]:checked+span{background:var(--warn);color:var(--ink)}.seg input[value=fail]:checked+span{background:var(--bad);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.logo{display:inline-flex;align-items:center;gap:10px;font:700 18px var(--fd)}
.logo-m{width:32px;height:32px;border-radius:9px;background:var(--y);color:var(--ink);display:grid;place-items:center}

/* public site */
.pub-h{background:#fff;border-bottom:1px solid var(--rule)}
.pub-h .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.pub-h nav{display:flex;gap:2px;flex:1;overflow-x:auto;min-width:0}
.pub-h nav button{background:none;border:0;padding:8px 12px;border-radius:8px;white-space:nowrap}
.pub-h nav button:hover{background:var(--mist)}
.hero{background:var(--ink);color:#fff;padding-block:56px 64px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5.6vw,62px);letter-spacing:-.01em}.hero h1 em{font-style:normal;color:var(--y)}
.hero p.sub{font-size:18px;color:#d4d4cc;margin:18px 0 28px;max-width:34em}
.pp{background:#fff;color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -30px #000}
.pp-h{background:var(--y);padding:12px 18px;font:600 13px var(--fd);display:flex;justify-content:space-between}
.pp-b{padding:18px;display:grid;grid-template-columns:1fr 112px;gap:16px;align-items:center}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero{padding-block:36px 44px}}
.sec{padding-block:64px}.sec.mist{background:var(--mist)}
.sec h2{font-size:clamp(26px,3.4vw,38px);margin-bottom:10px}
.svc{display:flex;flex-direction:column;gap:10px}.svc .ico{width:44px;height:44px;border-radius:12px;background:var(--y);display:grid;place-items:center}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:16px;list-style:none;padding:0;margin:28px 0 0;counter-reset:s}
.how li{counter-increment:s;border-top:3px solid var(--ink);padding-top:12px;font-weight:500}
.how li::before{content:counter(s);display:block;font:700 28px var(--fd);color:var(--y);-webkit-text-stroke:1px var(--ink);margin-bottom:4px}
.pk{border:1px solid var(--rule);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px;background:#fff;min-width:0}
.pk.feat{background:var(--ink);color:#fff;border-color:var(--ink)}.pk.feat .mu,.pk.feat .note{color:#bdbdb4}
.pk-price b{font:700 30px var(--fd);font-variant-numeric:tabular-nums}.pk-price small{display:block;color:var(--mute)}
.pk ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:14px;flex:1}
.pk li{display:flex;gap:8px}.pk li svg{margin-top:3px;color:var(--ok)}.pk.feat li svg{color:var(--y)}
.foot{background:var(--ink);color:#bdbdb4;padding-block:28px;font-size:13px}

/* customer + admin shells */
.cnav{background:#fff;border-bottom:1px solid var(--rule)}
.cnav .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.cnav nav{display:flex;gap:4px;overflow-x:auto;flex:1 1 320px;min-width:0}
.cnav nav button,.side button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:500;white-space:nowrap}
.cnav nav button.on{background:var(--y)} .cnav nav button:hover:not(.on){background:var(--mist)}
.page{padding-block:28px 64px;background:var(--mist);min-height:70vh}
.ph{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}.ph h1{font-size:clamp(24px,3vw,32px)}
.adm{display:grid;grid-template-columns:236px minmax(0,1fr);background:var(--mist);min-height:75vh}
.side{background:var(--ink);color:#fff;padding:18px 12px 24px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.side button{color:#d4d4cc;width:100%}.side button.on{background:var(--y);color:var(--ink);font-weight:600}.side button:hover:not(.on){background:#2b2b2b}
.side .logo{color:#fff;padding:4px 8px 14px}.side small{padding:10px 14px 4px;color:#8f8f88;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.adm-main{padding:24px 24px 64px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
@media(max-width:900px){.adm{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;padding:8px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}.side small,.side .logo{display:none}.adm-main{padding-left:max(16px,env(safe-area-inset-left,0px))}}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.sticky{position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}
@media(max-width:1000px){.sticky{position:static}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal b{font:600 12px var(--fd);color:var(--mute);text-align:center;padding:4px}
.cal div.d{min-height:72px;border:1px solid var(--rule);border-radius:8px;padding:4px 6px;font-size:12px;background:#fff;overflow:hidden}
.cal div.d.td{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.cal div.d.o{background:transparent;border-color:transparent}
.cal .jc{display:block;margin-top:3px;background:var(--y);border-radius:4px;padding:0 4px;font:500 10.5px var(--fm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .jc.dn{background:var(--ink);color:#fff}

/* inspection form + close job */
.item{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;padding:10px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.item:last-child{border:0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.photos figure{margin:0;position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--rule)}
.photos img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.photos button{position:absolute;top:6px;right:6px;border:0;background:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:10px 4px;border-bottom:1px solid var(--rule);color:var(--mute);align-items:start}
.steps li i{width:26px;height:26px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font:600 12px var(--fd);font-style:normal}
.steps li.run{color:var(--ink);font-weight:600}.steps li.run i{background:var(--y)}
.steps li.ok{color:var(--ink)}.steps li.ok i{background:var(--ok);color:#fff}.steps li.bad{color:var(--bad-ink)}.steps li.bad i{background:var(--bad);color:#fff}
.steps small{display:block;font-weight:400;color:var(--mute)}

/* certificate + pdf */
.cert{background:#fff;border:1px solid var(--rule);border-radius:6px;box-shadow:var(--sh);max-width:860px;margin-inline:auto;overflow:hidden}
.cert-top{background:var(--ink);color:#fff;padding:22px 28px;display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.cert-top .logo{color:#fff}.cert-top h2{font-size:22px;color:var(--y)}
.cert-stripe{height:6px;background:var(--y)}
.cert-body{padding:28px;display:flex;flex-direction:column;gap:22px}
.qrb{width:132px;height:132px;padding:8px;border:1px solid var(--rule);border-radius:10px;background:#fff}.qrb svg{display:block;width:100%;height:100%}
.paper{background:#fff;border:1px solid var(--rule);max-width:820px;margin:0 auto 20px;box-shadow:var(--sh);padding:36px;min-height:520px;display:flex;flex-direction:column;gap:18px;font-size:13.5px}
.paper .ph2{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--y);padding-bottom:10px;gap:12px;flex-wrap:wrap}
.paper .pf{margin-top:auto;display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);border-top:1px solid var(--rule);padding-top:8px}
.paper h4{font-size:15px;border-left:0;margin-bottom:6px}

/* LINE stage */
.stage{background:var(--mist);padding-block:28px 48px}
.stage .wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:36px;align-items:start}
@media(max-width:900px){.stage .wrap{grid-template-columns:1fr;justify-items:center}}
.phone{width:100%;max-width:380px;height:min(780px,calc(100vh - 110px));min-height:600px;background:#fff;border-radius:34px;border:8px solid var(--ink);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -30px #000}
.ph-h{background:var(--ink);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center}.ph-h b{font:600 15px var(--fd)}
.chat{flex:1;overflow-y:auto;background:#EDEDE8;padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:10px 14px;border-radius:16px;background:#fff;font-size:14px;align-self:flex-start}.bub.me{align-self:flex-end;background:var(--y)}
.tm{font-size:11px;color:var(--mute);margin-top:2px}
.lc{background:#fff;border-radius:16px;overflow:hidden;max-width:92%;align-self:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lc-h{background:var(--ink);color:var(--y);padding:10px 14px;font:600 14px var(--fd);display:flex;gap:8px;align-items:center}
.lc-b{padding:14px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.lc-f{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.lc-f button{border:0;background:#fff;padding:11px;font-weight:600;font-size:13.5px;border-top:1px solid var(--rule)}.lc-f button:first-child{border-top:0;background:var(--y)}
.rich{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink)}
.rich button{border:0;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12.5px/1.3 var(--fd);min-height:92px}
.rich small{font:400 10px var(--fb);opacity:.75}
.rich .a{background:var(--y);color:var(--ink)}.rich .b{background:var(--ink);color:#fff}.rich .c{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 .5px var(--rule)}
.rich .b svg{color:var(--y)}

/* modal + toast */
.ovl{position:fixed;inset:0;background:rgba(23,23,23,.55);z-index:80;display:grid;place-items:center;padding:16px}
.mdl{background:#fff;border-radius:18px;width:min(100%,520px);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px -20px #000}
.mdl.wide{width:min(100%,760px)}
.mdl-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:#fff;z-index:1}
.mdl-h .x{border:0;background:var(--mist);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.mdl-b{padding:20px;display:flex;flex-direction:column;gap:14px}
.toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,460px)}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px -10px #000;border-left:5px solid var(--y)}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
.passc{max-width:460px;margin:0 auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--rule)}
.passc .top{background:var(--ink);color:#fff;padding:18px 22px}.passc .top h2{color:var(--y);font-size:19px;margin-top:8px}
.passc .bd{padding:20px;display:flex;flex-direction:column;gap:16px}
@media(prefers-reduced-motion:no-preference){.btn,.pnav button{transition:background .15s}}

/* ===== phone device + yellow/white overrides ===== */
body{background:var(--mist)}
.stagewrap{max-width:1040px;margin-inline:auto;padding-top:24px;padding-bottom:max(32px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:40px;align-items:start}
.ctl{padding-top:12px;max-width:520px;min-width:0}
.device{position:sticky;top:16px;width:100%;max-width:392px;height:min(844px,calc(100vh - 32px));min-height:620px;background:#fff;border:9px solid var(--ink);border-radius:46px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 40px 80px -40px rgba(0,0,0,.6)}
.sbar{flex:none;height:32px;background:var(--y);display:flex;justify-content:space-between;align-items:center;padding:0 24px;font:600 12.5px var(--fd)}
.sbi{display:flex;gap:2px;align-items:flex-end}.sbi i{width:3px;background:var(--ink);border-radius:1px}.sbi i:nth-child(1){height:5px}.sbi i:nth-child(2){height:7px}.sbi i:nth-child(3){height:9px}.sbi b{width:20px;height:10px;border:1.5px solid var(--ink);border-radius:3px;margin-left:6px}
.screen{flex:1;min-height:0;position:relative;overflow:hidden;background:#fff}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;min-width:0}
#liff{z-index:5;transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s}
#liff.open{transform:none;visibility:visible;transition:transform .28s ease}
@media(prefers-reduced-motion:reduce){#liff,#liff.open{transition:none}}
@media(max-width:900px){.stagewrap{grid-template-columns:1fr;justify-items:center}.ctl{order:2;width:100%}.device{position:relative;top:0}}
@media(max-width:440px){.device{border-width:6px;border-radius:34px}}
.wrap{max-width:none;padding-left:16px;padding-right:16px}
/* LINE chat */
.lh{flex:none;background:var(--y);display:flex;align-items:center;gap:10px;padding:8px 14px}
.lh-n{flex:1;min-width:0;line-height:1.25}.lh-n b{font:600 15px var(--fd);display:block}.lh-n small{font-size:11px;opacity:.75}
.chat{flex:1;min-height:0;overflow-y:auto;background:#FFF9E5;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.bub.me{background:var(--y)}.lc-h{background:var(--y);color:var(--ink)}.lc-f button:first-child{background:var(--y)}
.inbar{flex:none;display:flex;gap:10px;align-items:center;padding:6px 12px;border-top:1px solid var(--rule);background:#fff;color:var(--mute)}
.inbar .inp{flex:1;background:var(--mist);border-radius:999px;padding:6px 14px;font-size:14px}
.rich{flex:none;border-top:2px solid var(--y)}.rich button{min-height:80px;box-shadow:inset 0 0 0 .5px var(--rule)}
.rich .a{background:var(--y);color:var(--ink)}.rich .b{background:var(--y-wash);color:var(--ink)}.rich .b svg{color:var(--ink)}.rich .c{background:#fff;color:var(--ink)}
/* LIFF in-app browser */
.lbar{flex:none;background:var(--y);display:flex;align-items:center;gap:4px;padding:6px 8px}
.lbar button{border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.lbar .t{flex:1;min-width:0;text-align:center;line-height:1.25}.lbar .t b{display:block;font:600 15px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar .t small{font-size:11px;opacity:.75;display:inline-flex;gap:3px;align-items:center}
.lbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:var(--mist);overscroll-behavior:contain}
.capp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--rule)}
.capp-h .pill{max-width:58%;overflow:hidden;text-overflow:ellipsis}
.page{padding-block:16px 28px;min-height:0;background:var(--mist)}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border-top:1px solid var(--rule)}
.tabbar button{border:0;background:none;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#555}
.tabbar .ti{width:44px;height:26px;border-radius:13px;display:grid;place-items:center}.tabbar .on{color:var(--ink);font-weight:600}.tabbar .on .ti{background:var(--y)}
.pnv{display:flex;gap:2px;overflow-x:auto;padding:0 10px 8px}.pnv button{background:none;border:0;padding:6px 10px;border-radius:8px;white-space:nowrap;font-size:13px}.pnv button:hover{background:var(--mist)}
/* phone-only layout */
.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{padding:14px}.stat b{font-size:24px}
.card{padding:16px;border-radius:14px}
.hb{grid-template-columns:92px 1fr 82px}
.ph h1{font-size:22px}.ph{margin-bottom:14px}
.cols{grid-template-columns:1fr}.sticky{position:static}
.adm{grid-template-columns:1fr;min-height:0}
.side{flex-direction:row;overflow-x:auto;background:#fff;color:var(--ink);padding:8px 12px;border-bottom:1px solid var(--rule)}
.side small,.side .logo{display:none}.side button{color:var(--ink);width:auto}.side button.on{background:var(--y);color:var(--ink)}.side button:hover:not(.on){background:var(--mist)}
.adm-main{padding:16px}
.tbl th,.tbl td{padding:10px 8px}
.kv{grid-template-columns:minmax(90px,120px) 1fr;gap:6px 12px}
.tabs button.on{background:var(--y);border-color:var(--y);color:var(--ink);font-weight:600}
.seg span{min-width:48px;padding:8px 10px}
.seg input[value=pass]:checked+span{background:var(--ok);color:#fff}
.cal div.d{min-height:50px;padding:3px}.cal .jc{font-size:9px}
.photos{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
/* yellow + white brand surfaces */
.logo-m{border:1.5px solid var(--ink)}
.hero{background:var(--y);color:var(--ink);padding-block:26px 30px}
.hero .wrap{grid-template-columns:1fr;gap:22px}
.hero h1{font-size:34px}.hero h1 em{color:var(--ink);background:#fff;padding:0 .2em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p.sub{color:#4a3b00;font-size:16px;margin:14px 0 20px}
.hero .btn.o{background:#fff}.hero .pill.y{background:#fff}
.pp{box-shadow:0 18px 40px -22px rgba(23,23,23,.5)}.pp-h{background:var(--ink);color:var(--y)}.pp-b{grid-template-columns:1fr 96px}
.sec{padding-block:30px}.sec h2{font-size:24px}
.pk{padding:18px}.pk.feat{background:var(--y);color:var(--ink);border-color:var(--y)}.pk.feat .mu,.pk.feat .note{color:#4a3b00}.pk.feat li svg{color:var(--ink)}.pk.feat .btn.y{background:var(--ink);color:#fff;border-color:var(--ink)}
.foot{background:#fff;color:var(--mute);border-top:1px solid var(--rule)}
.cert-top{background:var(--y);color:var(--ink);padding:16px}.cert-top .logo{color:var(--ink)}.cert-top h2{color:var(--ink);font-size:19px}
.cert-stripe{background:var(--ink);height:3px}.cert-body{padding:16px}.paper{padding:18px}
.passc .top{background:var(--y);color:var(--ink)}.passc .top h2{color:var(--ink)}
.ovl{position:absolute;padding:12px}.mdl{max-height:100%}
.toast-root{position:absolute;bottom:78px;width:calc(100% - 24px)}

/* fit-to-screen fixes: grid tracks may shrink below content width */
.stagewrap{grid-template-columns:minmax(0,1fr) 392px}
@media(max-width:900px){.stagewrap{grid-template-columns:minmax(0,1fr)}}
.g2,.g3{grid-template-columns:minmax(0,1fr)}
.cols,.adm,.hero .wrap{grid-template-columns:minmax(0,1fr)}
.pp-b{grid-template-columns:minmax(0,1fr) 96px}
.cols>*,.stack>*,.adm>*,.hero .wrap>*,.pp-b>*,.page,.wrap,.lbody>*{min-width:0;max-width:100%}
.lbody img,.lbody svg,.lbody iframe{max-width:100%}
.lbody{overflow-wrap:break-word}
.stp,.tabs,.chips,.row{max-width:100%}
.kv{grid-template-columns:minmax(80px,110px) minmax(0,1fr)}
.cal{grid-template-columns:repeat(7,minmax(0,1fr))}
.hb{grid-template-columns:84px minmax(0,1fr) 78px}

/* ===== scenes ===== */
.scenes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:1040px;margin-inline:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}

.scenes button.on{background:var(--y)}.scenes button.on b{background:#fff}
.stagewrap{padding-top:16px}

.appnav{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;background:#fff;border-top:1px solid var(--rule);padding:4px 0 6px}

.wc.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--y)}
.cam{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 20%,#3a3a38,#0d0d0d)}

.stk-i{position:absolute;inset:3px;background:var(--y);clip-path:polygon(50% 0,100% 9%,100% 82%,50% 100%,0 82%,0 9%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px 0;text-align:center;line-height:1.15}

/* QR */
function fakeQr(t){
  let h=2166136261;for(const c of t){h=Math.imul(h^c.charCodeAt(0),16777619)>>>0}
  const n=25,rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h};
  let o='<svg viewBox="0 0 '+n+' '+n+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="'+n+'" height="'+n+'" fill="#fff"/>';
  const fin=(x,y)=>x<8&&y<8||x>n-9&&y<8||x<8&&y>n-9;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!fin(x,y)&&rnd()%2)o+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#171717"/>';
  [[0,0],[n-7,0],[0,n-7]].forEach(([x,y])=>{o+='<rect x="'+x+'" y="'+y+'" width="7" height="7" fill="#171717"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" fill="#171717"/>'});
  return o+'</svg>';
}
function qrSvg(text){
  try{if(window.qrcode){const q=window.qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag(4,0).replace(/^(<svg[^>]*?) width="[^"]*" height="[^"]*"/,'$1 width="100%" height="100%"')}}catch(e){}
  return fakeQr(text);
}

/* ===== ROI ===== */
function roiCalc(r){
  const pk=pkgOf(r.pkg),member=pk.price;
  const annual=r.heads*r.sess*r.kwhPer*r.price*r.days,monthly=annual/12;
  const lossAll=annual*r.dev/100*r.months/12,share=r.role==='host'?r.share/100:1,risk=lossAll*share,kept=risk*r.rec/100;
  const perVisit=r.visitPrice,diff=risk-perVisit,net=kept-member;
  const basis=annual*r.months/12;
  return {pk,monthly,annual,lossAll,risk,impact:kept,kept,member,perVisit,diff,net,roi:member?net/member*100:0,
    breakEven:basis?perVisit/basis*100:0,avgMember:pk.inspections?member/pk.inspections:0,over:r.heads>pk.covers};
}

const stationRow=s=>{
  const ch=db.chargers.filter(c=>c.station===s.id),hd=ch.reduce((a,c)=>a+c.heads.length,0);
  const recs=ch.map(c=>lastRec(c.id)).filter(Boolean).sort((a,b)=>b.date.localeCompare(a.date));
  const nexts=ch.map(c=>{const r=lastRec(c.id);return r?r.next:null}).filter(Boolean).sort();

  return {ch,hd,last:recs[0],next:nexts[0],job};
};

const devOf=m=>{const a=parseFloat(m.ref),b=parseFloat(m.disp);return a>0&&!isNaN(b)?(b-a)/a*100:null};
const devHtml=m=>{const d=devOf(m);if(d===null)return '<span class="mu">กรอกค่าพลังงานทั้งสองค่าเพื่อคำนวณ</span>';return '<b class="tn">'+(d>0?'+':'')+num(d,2)+'%</b> '+(Math.abs(d)>1?pill('เกินช่วงอ้างอิงภายใน ±1.0% (ตัวอย่าง)','warn'):pill('อยู่ในช่วงอ้างอิงภายใน','ok'))};
function missingList(j){
  const F=getForm(j),o=[];
  j.heads.forEach(h=>{const hf=F.heads[h];const mv=VIS.filter(v=>!hf.visual[v[0]]).length,mm=MEAS.filter(m=>isNaN(parseFloat(hf.m[m[0]]))).length;
    if(mv)o.push(h+': รายการตรวจยังไม่ครบ '+mv+' รายการ');if(mm)o.push(h+': ค่าที่ตรวจวัดยังไม่ครบ '+mm+' ค่า');if(!hf.result)o.push(h+': ยังไม่ระบุผลของหัวชาร์จ')});
  if(!F.photos.length)o.push('ต้องแนบรูปภาพอย่างน้อย 1 รูป');
  const flag=j.heads.some(h=>Object.values(F.heads[h].visual).some(v=>v==='obs'||v==='fail')||F.heads[h].result!=='pass'&&F.heads[h].result);
  if(flag&&!F.observations.trim())o.push('ต้องระบุข้อสังเกตประกอบรายการที่มีข้อสังเกตหรือไม่ผ่าน');
  return o;
}
function progressOf(j){
  const F=getForm(j),per=VIS.length+MEAS.length+1,tot=j.heads.length*per+1;let n=0;

  if(F.photos.length)n++;return Math.round(n/tot*100);
}

function runClose(j){
  const F=getForm(j),rec=buildRecord(j);
  const c=S.closing={jobId:j.id,done:0,res:[],finished:false,rec,notif:null};
  const T=[
    ()=>({t:'ครบถ้วน '+j.heads.length+' หัวชาร์จ · รูปภาพ '+F.photos.length+' รูป'}),
    ()=>{j.status='Completed';audit('บันทึกผลตรวจ '+j.id+' (Completed)');return {t:'ผลรวม: '+OV[rec.overall][0]}},
    ()=>({t:'Certificate สร้างแล้ว v1'}),
    ()=>({t:rec.docId}),
    ()=>({t:rec.inspector+' · '+fmt(rec.date)}),
    ()=>{rec.pdf=(1.1+rec.photos.length*.3).toFixed(1)+' MB';return {t:rec.docId+'.pdf · '+rec.pdf+' (จำลอง)'}},
    ()=>{db.records.push(rec);return {t:'QR ของ '+rec.chargerId+' ชี้ไปที่ข้อมูลล่าสุดแล้ว'}},
    ()=>({t:fmt(rec.date)}),
    ()=>({t:fmt(rec.next)+' (รอบ '+(F.interval||12)+' เดือน)'}),
    ()=>{const n=pushLine('report',{docId:rec.docId,jobId:j.id,station:rec.stationName,charger:rec.chargerId,heads:rec.heads.length,date:rec.date},{fail:S.failLine});c.notif=n;return n.status==='Sent'?{t:'ส่งสำเร็จ'}:{t:'Failed — '+n.error,bad:1}},
    ()=>{j.status='Report Issued';j.doc=rec.docId;audit('ออกเอกสาร '+rec.docId+' สำหรับ '+j.id+' (Report Issued)');return {t:'Job Status → Report Issued'}}];
  const step=()=>{
    if(S.view!=='a-close'){while(c.done<T.length){c.res[c.done]=T[c.done]();c.done++}c.finished=true;return}
    if(c.done>=T.length){c.finished=true;const s=$('#steps');if(s)s.innerHTML=stepsHtml();const d=$('#close-done');if(d)d.innerHTML=closeDone(j,c);return}
    c.res[c.done]=T[c.done]();c.done++;const s=$('#steps');if(s)s.innerHTML=stepsHtml();setTimeout(step,420);
  };
  render();setTimeout(step,300);
}

function stkSvg(s,w){
  if(!s)return '';
  if(s.img)return '<img src="'+s.img+'" alt="'+esc('สติกเกอร์ '+s.t)+'" style="display:block">';
  const F='font-family="Prompt,IBM Plex Sans Thai,sans-serif"',bolt='M70 6 L22 68 H52 L40 112 L98 46 H68 L84 6 Z';
  const ACC={spark:'<path d="M98 20 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#FFC928" stroke="#171717" stroke-width="2"/>',
   heart:'<path d="M96 36 c-10 -9 -14 -20 -4 -22 4 0 4 4 4 4 0 0 0 -4 4 -4 10 2 6 13 -4 22z" fill="#E8453C" stroke="#171717" stroke-width="2"/>',
   check:'<circle cx="98" cy="26" r="13" fill="#2BA55A" stroke="#fff" stroke-width="3"/><polyline points="91 26 96 31 105 20" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>',
   star:'<polygon points="98,10 102,21 114,21 104,28 108,40 98,33 88,40 92,28 82,21 94,21" fill="#FFC928" stroke="#171717" stroke-width="2"/>',
   clock:'<circle cx="98" cy="26" r="13" fill="#fff" stroke="#171717" stroke-width="3"/><polyline points="98 18 98 26 104 30" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round"/>',
   mag:'<circle cx="94" cy="24" r="11" fill="#fff" fill-opacity=".85" stroke="#171717" stroke-width="3.5"/><line x1="102" y1="32" x2="112" y2="42" stroke="#171717" stroke-width="5" stroke-linecap="round"/>'};
  const fs=s.t.length>12?9.5:12;
  return '<svg viewBox="0 0 120 140" width="'+w+'" role="img" aria-label="สติกเกอร์ '+esc(s.t)+'" style="display:block"><path d="'+bolt+'" fill="#FFC928" stroke="#fff" stroke-width="12" stroke-linejoin="round"/><path d="'+bolt+'" fill="#FFC928" stroke="#171717" stroke-width="4" stroke-linejoin="round"/>'+
   '<circle cx="53" cy="62" r="3.6" fill="#171717"/><circle cx="71" cy="56" r="3.6" fill="#171717"/><path d="M54 74 q10 10 20 -4" fill="none" stroke="#171717" stroke-width="3.2" stroke-linecap="round"/>'+ACC[s.a]+
   '<rect x="6" y="116" width="108" height="21" rx="10.5" fill="#fff" stroke="#171717" stroke-width="2.5"/><text x="60" y="131" text-anchor="middle" font-size="'+fs+'" font-weight="700" fill="#171717" '+F+'>'+esc(s.t)+'</text></svg>';
}
const stkTray=()=>'<div class="stkt">'+STK.map((s,i)=>'<button data-act="stkSend" data-id="'+i+'" aria-label="ส่งสติกเกอร์ '+esc(s.t)+'">'+stkSvg(s,62)+'</button>').join('')+'</div>';
const NS=()=>S.nset||(S.nset={badge:true,monthly:true,issue:true,report:true,remind:true});
V('notify-settings','customer',()=>{
  const n=NS(),row=(k,t,d)=>'<label class="card flat" style="display:flex;gap:12px;align-items:flex-start;padding:14px;cursor:pointer"><span style="flex:1;min-width:0"><b>'+t+'</b><br><span class="note">'+d+'</span></span><input type="checkbox" class="tgl" data-chg="nset" data-id="'+k+'"'+(n[k]?' checked':'')+' aria-label="'+t+'"></label>';
  return head('ตั้งค่าการแจ้งเตือน','เลือกข้อความที่ต้องการรับทาง LINE')+'<div class="stack">'+
   row('badge','เหรียญสายฟ้าใกล้หมด','แจ้งล่วงหน้า 60, 30 และ 14 วันก่อนสมาชิกหมดอายุ')+
   row('monthly','สรุปประจำเดือน','จำนวนครั้งที่สติกเกอร์ถูกสแกนและสถานีถูกเปิดดูบนแมป')+
   row('issue','ผู้ใช้ EV แจ้งปัญหา','แจ้งทันทีเมื่อมีผู้ใช้แจ้งเรื่องจากหน้า Passport')+
   row('report','ผลตรวจพร้อมแล้ว','ส่งบัตรผลตรวจและลิงก์ Passport หลังปิดงาน')+
   row('remind','นัดหมายและการเตือนก่อนวันตรวจ','ยืนยันนัดและเตือนก่อนวันตรวจ 1 วัน')+
   '<div class="box">'+ic('alert',16)+'<span>ไม่ส่งข้อความระหว่าง 21:00 - 08:00 น. และไม่เกิน 1 ข้อความโปรโมชันต่อสัปดาห์ (ตัวอย่างนโยบาย) ข้อความระบบสำคัญ เช่น ยืนยันนัดหมาย ยังส่งตามปกติ</span></div></div>';
},{roles:CUST,nav:'stations'});
V('line','line',()=>{
  const mode=S.lineMode||'menu',open=S.richOpen!==false;
  let last='',prevIn=false,out='';
  db.chat.forEach(m=>{
    const n=m.kind==='notif'?db.notifs.find(x=>x.id===m.nid):null,tm=n?n.time:m.t,day=tm.slice(0,10),hm=tm.slice(11,16);
    if(day!==last){out+='<div class="dv"><span>'+(day===TODAY?'วันนี้':dayLabel(day))+'</span></div>';last=day;prevIn=false}
    if(m.kind==='text'&&m.from==='me'){out+='<div class="mrow me"><span class="mm">อ่านแล้ว<br>'+hm+'</span><div class="bub me">'+esc(m.text)+'</div></div>';prevIn=false}
    else if(m.kind==='sticker'&&m.from==='me'){out+='<div class="mrow me"><span class="mm">อ่านแล้ว<br>'+hm+'</span><div class="stkb">'+stkSvg(STK[m.sid],120)+'</div></div>';prevIn=false}
    else if(m.kind==='sticker'){out+='<div class="mrow oa">'+(prevIn?'<span class="av sp0"></span>':LAV)+'<div class="cont"><div class="stkb">'+stkSvg(STK[m.sid],120)+'</div></div><span class="mt">'+hm+'</span></div>';prevIn=true}

  ob(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));ob(2,()=>push('<< /Type /Pages /Kids ['+kids+'] /Count '+n+' >>'));

    ob(pid,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>'));
    ob(cid,()=>push('<< /Length '+ct.length+' >>\nstream\n'+ct+'\nendstream'));
    ob(iid,()=>{push('<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.u.length+' >>\nstream\n');push(im.u);push('\nendstream')})});

  return '<div class="msheet wsh"><div class="grab"></div><div class="mcd"><div class="mph">'+stPhoto(sel,96,76)+'</div><div style="flex:1;min-width:0"><div class="row" style="flex-wrap:nowrap;gap:6px;align-items:center">'+brand+'<b style="font:600 16px/1.3 var(--fd);flex:1;min-width:0">'+esc(sel.name)+'</b><button class="xb" data-act="pickSt" data-id="'+sel.id+'" aria-label="ปิด">'+ic('x',18)+'</button></div><p class="note" style="margin:2px 0 4px">'+esc(stAddr(sel))+'</p><div class="row" style="gap:10px;font-size:12px;color:#444"><span style="color:#E8A800;font-weight:600">★ '+sel.rate+'</span><span>'+ic('pin',12)+' '+sel.km+' กม.</span><span>'+ic('clock',12)+' '+sel.hours+'</span></div></div></div>'+
   (v?'<button class="sbn" data-act="cxOpen" data-from="'+(web?'x-webmap':'x-elexa')+'" data-id="'+sel.charger+'|0"><span class="sbh">'+ic('bolt',20)+'</span><span style="flex:1;min-width:0;text-align:left;line-height:1.3"><b>ผ่านการตรวจสอบ ChargerXpert</b><br><small>'+vn+' จาก '+us.length+' หัวชาร์จ · ใช้ได้ถึง '+fmtB(v.next)+'</small></span><span class="sbq">'+qrSvg(passUrl(sel.charger))+'</span></button>':'')+
   '<div class="row" style="flex-wrap:nowrap;gap:8px"><button class="btn k" style="flex:1.2" data-act="nope" data-id="นำทาง (ฟีเจอร์เดิมของแอป)">'+ic('arrow',15)+'นำทาง</button><button class="btn o" style="flex:1" data-act="nope" data-id="แชร์ (ฟีเจอร์เดิม)">'+ic('share',14)+'แชร์</button><button class="btn o" style="flex:1.4;white-space:nowrap" data-act="'+(web?'wStn':'xStn')+'" data-id="'+sel.id+'">ดูรายละเอียด ›</button></div></div>';
}
(function(){
  const e=VIEWS['x-elexa'],w=VIEWS['x-webmap'];
  const wrap=(fn,web)=>()=>{
    let h=fn();
    const re=/<div class="msheet[^"]*">[\s\S]*?<\/div><\/div>(?=<nav|$)/;
    const sel=MAPST.find(s=>s.id===S.sel);
    if(sel&&(web||true)){const card=mapCard(sel,verifiedOf(sel),web),i=h.indexOf('<div class="msheet');if(i>=0){const j=web?h.lastIndexOf('</div>'):h.indexOf('</div><nav');h=h.slice(0,i)+card+h.slice(j)}}
    return h;
  };
  e.fn=wrap(e.fn,false);w.fn=wrap(w.fn,true);
})();

  notifyRenew(el){const c=allCust().find(x=>x.id===el.dataset.id);const n=pushLine('renew',{pkg:pkgOf(c.pkg).name,end:c.end,ref:c.name});toast('บันทึกการส่งแจ้งเตือนต่ออายุ ('+n.status+')','ok');render()},
  custView(el){const c=allCust().find(x=>x.id===el.dataset.id);modal(c.name,kv([['ผู้ติดต่อ',esc(c.contact)],['แพ็กเกจ',pkgOf(c.pkg).name],['สถานะสมาชิก',pill(c.status,memKind(c.status))],['หมดอายุ',fmt(c.end)],['การชำระเงิน',pill(c.payment,payK(c.payment))],['สถานี/เครื่อง/หัว',c.stations+' / '+c.chargers+' / '+c.heads]])+(c.real?'<h4>สถานี</h4>'+db.stations.map(s=>'<p>'+esc(s.name)+' · '+db.chargers.filter(x=>x.station===s.id).length+' เครื่อง</p>').join('')+'<h4>ประวัติการตรวจ</h4>'+db.records.filter(r=>r.customerId==='C-001').map(r=>'<p><span class="mono">'+r.docId+'</span> · '+fmtS(r.date)+' · '+OV[r.overall][0]+'</p>').join(''):'<p class="note">ข้อมูลโดยย่อ (ลูกค้าตัวอย่าง)</p>'),true)},
  custForm(el){const c=el.dataset.id&&el.dataset.id!=='C-001'?db.customers.find(x=>x.id===el.dataset.id):null;if(el.dataset.id==='C-001'){toast('ข้อมูลของ ABC Energy แก้ไขได้จากฝั่งลูกค้า');return}modal(c?'แก้ไขลูกค้า':'เพิ่มลูกค้า','<form class="stack" data-submit="cust" data-id="'+(c?c.id:'')+'">'+field('ชื่อบริษัท','name',c&&c.name,{req:1})+field('ผู้ติดต่อ','contact',c&&c.contact,{req:1})+selectF('แพ็กเกจ','pkg',db.packages.map(p=>[p.id,p.name]),c?c.pkg:'basic')+'<button class="btn y" type="submit">บันทึก</button></form>')},
  staffForm(){modal('เพิ่มเจ้าหน้าที่','<form class="stack" data-submit="staff">'+field('ชื่อ','name','',{req:1})+field('อีเมล','email','',{type:'email',req:1})+selectF('Role','role',[['Inspector','Inspector'],['Admin','Admin']],'Inspector')+'<button class="btn y" type="submit">เพิ่ม</button></form>')},
  passFull(el){const r=recOf(el.dataset.id);if(S.role&&r&&S.role==='customer'&&r.customerId!=='C-001'){toast('รายงานฉบับเต็มเป็นของลูกค้ารายอื่น ไม่มีสิทธิ์เปิด','bad')}else if(S.role){go('cert',el.dataset.id)}else modal('รายงานฉบับเต็มจำกัดสิทธิ์','<p>กรุณาเข้าสู่ระบบด้วยบัญชีเจ้าของสถานีเพื่อดูรายงานฉบับเต็ม</p><div class="row"><button class="btn y" data-go="login">เข้าสู่ระบบ</button><button class="btn o" data-act="mclose">ปิด</button></div>')}
};
Object.assign(ACT,SCENE_ACT);
function upd(j){const p=$('#photos');if(p)p.innerHTML=photosHtml(j);const s=$('#form-side');if(s)s.innerHTML=sideHtml(j)}
const CHG={
  role(t){S.role=t.value||null;go(S.role?HOME[S.role]:'line')},
  roiStation(t){const s=t.value;S.roiStation=s;if(s){const cs=db.chargers.filter(c=>c.station===s);S.roi.chargers=cs.length;S.roi.heads=cs.reduce((a,c)=>a+c.heads.length,0)}render()},
  passMem(t){S.passMem=t.value;render()},
  interval(t){getForm(jobOf(S.param)).interval=parseInt(t.value,10)||12},
  failLine(t){S.failLine=t.checked},
  staffRole(t){db.staff.find(s=>s.id===t.dataset.id).role=t.value;toast('เปลี่ยน Role แล้ว','ok');render()}
};
Object.assign(CHG,SCENE_CHG);
const SUBMIT={
  register(f){const d=Object.fromEntries(new FormData(f));S.reg={company:d.company,contact:d.contact,email:d.email,phone:d.phone,pkg:d.pkg};S.after={view:'dashboard'};S.lineStep=1;go('link-line')},
  login(f){const d=Object.fromEntries(new FormData(f));S.role=d.role;const a=S.after;S.after=null;toast('เข้าสู่ระบบเป็น '+d.role,'ok');if(a&&VIEWS[a.view]&&VIEWS[a.view].roles&&VIEWS[a.view].roles.includes(S.role))go(a.view,a.param);else go(HOME[S.role])},
  lead(f){const d=Object.fromEntries(new FormData(f));db.leads.unshift({name:d.name,phone:d.phone,time:stamp(),note:'ขอให้ติดต่อกลับช่วง'+d.when+' (จาก ROI Calculator)'});closeModal();toast('ส่งคำขอติดต่อกลับแล้ว (จำลอง)','ok')},
  station(f){const d=Object.fromEntries(new FormData(f)),id=f.dataset.id;if(id)Object.assign(stationOf(id),{name:d.name,address:d.address,contact:d.contact,consent:!!d.consent});else db.stations.push({id:'S-'+String(db.stations.length+1).padStart(3,'0'),name:d.name,address:d.address,contact:d.contact,consent:!!d.consent});closeModal();toast('บันทึกสถานีแล้ว','ok');render()},
  charger(f){const d=Object.fromEntries(new FormData(f)),id=f.dataset.id;if(id)Object.assign(chargerOf(id),{brand:d.brand,model:d.model,serial:d.serial,power:d.power});else{if(chargerOf(d.cid)){toast('Charger ID นี้มีอยู่แล้ว','bad');return}db.chargers.push({id:d.cid,station:f.dataset.st,brand:d.brand,model:d.model,serial:d.serial,power:d.power,heads:Array.from({length:+d.nh||2},(_,i)=>({id:'CCS2-0'+(i+1),type:'CCS2'}))})}closeModal();toast('บันทึกเครื่องชาร์จแล้ว','ok');render()},
  head(f){const d=Object.fromEntries(new FormData(f)),c=chargerOf(f.dataset.id),n=c.heads.filter(h=>h.type===d.type).length+1;c.heads.push({id:d.type+'-'+String(n).padStart(2,'0'),type:d.type});closeModal();toast('เพิ่มหัวชาร์จแล้ว','ok');render()},
  appt(f){const d=Object.fromEntries(new FormData(f)),c=chargerOf(d.cid),id=newJobId();db.jobs.push({id,customerId:'C-001',customer:db.company.name,station:stationOf(c.station).name,chargerId:c.id,serial:c.serial,heads:c.heads.map(h=>h.id),date:d.date,time:d.time,inspector:null,status:'Pending',note:d.note});audit('ลูกค้าขอนัดตรวจ '+id);closeModal();toast('ส่งคำขอ '+id+' แล้ว รอผู้ดูแลยืนยัน','ok');go('schedule')},
  assign(f){const d=Object.fromEntries(new FormData(f)),j=jobOf(f.dataset.id);Object.assign(j,{inspector:d.inspector,date:d.date,time:d.time,status:'Scheduled'});audit('มอบหมาย '+d.inspector+' ให้ '+j.id+' และยืนยันนัดหมาย');if(j.customerId==='C-001')pushLine('appt',{station:j.station,charger:j.chargerId,date:j.date,time:j.time,inspector:j.inspector,jobId:j.id});toast('ยืนยันนัดหมายแล้ว'+(j.customerId==='C-001'?' ส่ง LINE ถึงลูกค้า':''),'ok');render()},
  reissue(f){const d=Object.fromEntries(new FormData(f)),r=recOf(f.dataset.id);r.version++;r.versions.push({v:r.version,date:TODAY,by:USER[S.role],reason:d.reason});audit('ออกเอกสารฉบับแก้ไข '+r.docId+' v'+r.version+' (v'+(r.version-1)+' ยังเก็บไว้)');closeModal();toast('ออก '+r.docId+' v'+r.version+' แล้ว','ok');render()},
  cust(f){const d=Object.fromEntries(new FormData(f)),id=f.dataset.id;if(id)Object.assign(db.customers.find(x=>x.id===id),{name:d.name,contact:d.contact,pkg:d.pkg});else db.customers.push({id:'C-'+String(db.customers.length+2).padStart(3,'0'),name:d.name,contact:d.contact,pkg:d.pkg,status:'Active',end:addM(TODAY,12),stations:0,chargers:0,heads:0,payment:'Pending'});closeModal();toast('บันทึกลูกค้าแล้ว','ok');render()},
  staff(f){const d=Object.fromEntries(new FormData(f));db.staff.push({id:'U-'+(db.staff.length+1),name:d.name,role:d.role,phone:'—',email:d.email});closeModal();toast('เพิ่มเจ้าหน้าที่แล้ว','ok');render()}
};

/* ===== events ===== */
document.addEventListener('click',e=>{
  if(e.target.dataset&&e.target.dataset.bg){closeModal();return}
  const el=e.target.closest('[data-go],[data-act]');if(!el)return;
  if(el.dataset.go){
    e.preventDefault();closeModal();
    const s=el.dataset.go,i=s.indexOf(':'),v=i<0?s:s.slice(0,i),p=i<0?null:s.slice(i+1);
    if(el.dataset.as==='liff'&&!S.role){S.after={view:v,param:p};S.lineStep=1;go('link-line');return}
    if(el.dataset.as&&el.dataset.as!=='liff')S.role=el.dataset.as;
    S.formHead=0;go(v,p);return;
  }
  const f=ACT[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-submit]');if(!f)return;e.preventDefault();const fn=SUBMIT[f.dataset.submit];if(fn)fn(f)});
function fieldChange(t){
  const j=jobOf(S.param);if(!j)return;const F=getForm(j),d=t.dataset;
  if(d.f==='v')F.heads[d.h].visual[d.k]=t.value;
  else if(d.f==='m'){F.heads[d.h].m[d.k]=t.value;const el=document.getElementById('dev-'+d.h);if(el)el.innerHTML=devHtml(F.heads[d.h].m)}
  else if(d.f==='r')F.heads[d.h].result=t.value;
  else if(d.f==='obs')F.observations=t.value;
  else if(d.f==='notes')F.notes=t.value;
  else if(d.f==='file'){[...t.files].forEach(file=>{const rd=new FileReader();rd.onload=()=>{F.photos.push(rd.result);upd(j)};rd.readAsDataURL(file)});return}
  const s=$('#form-side');if(s)s.innerHTML=sideHtml(j);
}
function onField(e){
  const t=e.target,d=t.dataset||{};
  if(d.roi){S.roi[d.roi]=parseFloat(t.value)||0;document.querySelectorAll('[data-lbl="'+d.roi+'"]').forEach(x=>x.textContent=S.roi[d.roi]);const o=$('#roi-out');if(o)o.innerHTML=roiOut();return}
  if(d.est){S.est[d.est]=Math.max(1,parseInt(t.value,10)||1);const o=$('#est-out');if(o)o.innerHTML=db.packages.map(k=>{const x=estimate(k,S.est.chargers,S.est.heads,S.est.yrs);return '<tr><td><b>'+k.name+'</b></td><td>'+MODEL[k.model]+'</td><td class="tn">'+baht(x.base)+'</td><td class="tn">'+(x.pct?'−'+x.pct+'%':'—')+'</td><td class="tn"><b>'+baht(x.total)+'</b></td><td>'+(x.over?pill('เกิน '+k.covers+' หัว','warn'):pill('ครอบคลุม','ok'))+'</td></tr>'}).join('');return}
  if(d.f){fieldChange(t);return}
  if(e.type!=='change')return;
  if(d.pk){const i=d.pk.indexOf('.'),id=d.pk.slice(0,i),path=d.pk.slice(i+1),p=pkgOf(id),isTxt=path==='model'||path==='terms';setPath(p,path,isTxt?t.value:(parseFloat(t.value)||0));toast('บันทึกแพ็กเกจ '+p.name+' แล้ว (ตัวอย่าง)','ok');return}
  if(d.chg&&CHG[d.chg])CHG[d.chg](t);
}
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
})();
</script>
